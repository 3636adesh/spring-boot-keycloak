spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/experimental
          jwk-set-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs


logging:
  level:
    org:
      springframework:
        security: DEBUG
    root: debug




jwt:
  auth:
    converter:
      resource-id: spring-boot-app
      principle-attribute: preferred_username





